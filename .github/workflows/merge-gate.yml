# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      # No siblings cloned: both are pinned in pyproject, so pip fetches the
      # tags this repo was built against.
      siblings: ""
      python-version: "3.14"
      timeout-minutes: 6
      # tests/test_consumer_imports.py is this repo's dead-code gate, and it
      # asks the consumers: every caller of this package lives in another repo,
      # so it holds what each module declares against what genau, fun_time and
      # origenerator import. With nothing beside the checkout it can only skip,
      # which is what it did on every run here until now. Cloned and not
      # installed -- the scan reads their source, and installing three
      # applications to read it would cost more than the whole suite.
      prepare: |
        set -euo pipefail
        for repo in genau fun_time origenerator; do
          git clone --quiet --depth 1 "https://github.com/haglio/$repo.git" "../$repo"
        done

  # A consumer built against the candidate. Every caller of this package lives in
  # another repo and nothing pins a version, so a change here merges green
  # against this repo's own suite and turns a consumer red at an arbitrary later
  # time. The scan above holds the public names; this holds the behaviour. genau
  # is the cheapest of the three that drives the player.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      repo: genau
      siblings: "app_support shared_ui"
      python-version: "3.14"
      timeout-minutes: 15
      sdl-video: dummy

  # A version for each landing, so the apps that run this one can pin the copy
  # they were built against. The tag is the version: pyproject reads it with
  # setuptools-scm.
  tag:
    if: github.event_name == 'push'
    needs: full-suite
    uses: haglio/.github/.github/workflows/tag-the-landing.yml@main
    permissions:
      contents: write
