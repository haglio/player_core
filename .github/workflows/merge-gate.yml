name: merge gate (full suite)

# The merge queue's required check. The queue builds the candidate merge of a PR
# onto current main, runs the whole suite on that candidate, and fast-forwards
# main only when this is green -- so a red tree can never land. Also runs on PRs
# for early feedback and on push to main as a visible post-merge backstop.
#
# Runs on windows-latest for two repo-specific reasons. (1) The editable install
# MUST use compat mode: this repo's directory shares the package's name, so a
# default editable install lets the repo root win as a namespace shadow and
# player_core/__init__.py never runs -- tests/test_install.py fails loudly if it
# does. (2) The shared HUD chrome renders with Segoe UI Bold (segoeuib.ttf), a
# Windows face the hud/volume/timeline tests measure real glyph geometry against;
# it exists only on a Windows runner.
#
# shared_ui is checked out and installed: the HUD chrome draws the family's marks
# from it (hud_panel.draw_mark -> shared_ui.icons_pil), so the bin on a HUD is the
# bin on a toolbar. Importing it does NOT pull Qt into a player -- the geometry
# and the Pillow renderer import neither -- but pip installs PyQt6 alongside it,
# which costs a wheel on the runner and nothing at run time.
#
# app_support is installed for two reasons: the suite asks for its content-guard
# plugin, and a `-p` that cannot be imported is a hard pytest failure with no
# tests run; and clip_decode imports its hidden-subprocess kwargs to launch
# ffmpeg without a console window. It comes from its public repo rather than
# being checked out adjacent -- the way clipper, evolver, promptcrafter and
# scripture take it. The shared_ui step above is left as it is.
#
# libmpv is deliberately NOT provided here. import mpv loads mpv-2.dll at import
# time, but the unit suite never triggers it: no test constructs MpvPlayer, and
# player_core/__init__.py imports no submodule, so nothing on the tested paths
# imports mpv. The DLL-backed player is covered by fun_time's hidden-desktop
# integration suite, not this one -- so this runner needs no DLL.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: windows-latest
    # About three times a green run, so it can only fire on a hang. A green job
    # is ~52 s of checkout, sibling checkout and install plus one ~14 s suite
    # leg, so ~66 s. Without this, the queue's required check would sit on a
    # hung run until GitHub's six-hour default and print nothing that named it.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out shared_ui adjacent (the HUD marks come from it)
        uses: actions/checkout@v4
        with:
          repository: haglio/shared_ui
          path: shared_ui
      - name: Install (editable, compat mode)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "app_support @ git+https://github.com/haglio/app_support.git"
          pip install -e ./shared_ui --config-settings editable_mode=compat
          pip install -e ".[dev]" --config-settings editable_mode=compat
      - name: Run the suite
        shell: bash
        run: python -m pytest -q
