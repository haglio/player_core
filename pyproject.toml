[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "player-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "python-mpv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
[tool.setuptools.packages.find]
include = ["player_core*"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~6.4 s, so 60 s clears it nine times over and can
# only bite on a hang. The thread method prints the hung stack, which is what
# turns a stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds both halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
