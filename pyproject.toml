[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "player-core"
version = "0.1.0"
# 3.12, not 3.10: every gate in the family runs 3.12 and nothing has ever
# collected a suite on anything older, so >=3.10 was a promise no run backed.
requires-python = ">=3.12"
# Every requirement carries a ceiling: without one each run installs whatever
# PyPI served that morning, which is how the family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# the consumer venvs hold today.
dependencies = [
    "numpy>=2.4,<3",
    "pillow>=12,<13",
    "python-mpv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    # The suite's, not the package's: the HUD paint tests read the family's
    # colors, and `shared_ui.colors` builds them out of QColor. Nothing player_core
    # ships imports Qt, so it stays out of [project.dependencies] and the three
    # apps that install this package do not get a Qt wheel with it.
    "PyQt6>=6,<7",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
# The family checkouts this one is installed beside. shared_ui is a hard
# import-time dependency of both HUDs and was declared nowhere: a fresh venv
# that forgot it died on the first HUD import while this file said the package
# needed numpy, pillow and python-mpv. It cannot go in [project.dependencies]
# -- neither sibling is published, so pip would look for them on PyPI -- so
# this is the record, and tests/test_dependencies.py holds it against the tree.
[tool.haglio]
siblings = ["app_support", "shared_ui"]

[tool.setuptools.packages.find]
include = ["player_core*"]

[tool.pytest.ini_options]
# The content guard's tracked-tree check comes from app_support, not a copy
# kept here; a `-p` that cannot be imported fails the run outright, which is
# the answer wanted from a checkout that has stopped being guarded.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest
# test on a developer machine is that tracked-tree content scan, but it is not
# the slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is a cruise-control simulation at about a second.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
