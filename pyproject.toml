[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "player-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "python-mpv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
[tool.setuptools.packages.find]
include = ["player_core*"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is a cruise-control simulation at about a second.
# --timeout-method=thread is the half that pays for itself: it dumps the hung
# stack, which turns a stalled required check into a one-line diagnosis.
# tests/test_timeouts.py holds all three halves of it.
addopts = "-p no:cacheprovider --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
